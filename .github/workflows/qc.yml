name: Thermal Shield 360 QC

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  quality-control:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Thermal Shield QC tests
        run: node data/quality/test-qc.js
